<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>Chamacos - Contact</title>
        <meta name="description" content="Contact Programmer Chamacos">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="stylesheet" href="player/css/style.css">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/fontAwesome.css">
        <link rel="stylesheet" href="css/hero-slider.css">
        <link rel="stylesheet" href="css/templatemo-main.css">
        <link rel="stylesheet" href="css/owl-carousel.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
        <link rel="shortcut icon" href="/favicon.ico">        
        <script src="js/vendor/modernizr-2.8.3-respond-1.4.2.min.js"></script>
    </head> 
<body>
    <div class="service-content" style="min-height: 100vh;">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="row">
                        <div class="col-md-12 service-item">
                            <div id="texte-principal" class="" style="min-height: 150px;">
                                <h1>Programmer Chamacos</h1>
                                <div class="line-dec"></div>
                                <p>Pour une soirée, un concert, une terrasse ou un événement privé, contactez-nous afin d’imaginer une formule musicale adaptée.</p>
                            </div>
                            
                            <div class="text-center mb-5"><b><a href="mailto:chamacos.sete@gmail.com">chamacos.sete@gmail.com</a> <a href="tel:+33767436256">+33 767 436 256</a></b></div>
                            
                            <form id="contactForm" class="container mb-5" style="max-width:700px;">
                                <div class="row mb-4">
                                    <label for="nom" class="form-label fw-semibold" required>
                                    Nom
                                    </label>

                                    <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="nom"
                                    name="nom">
                                </div>
                                <div class="row mb-4">
                                    <label for="tel" class="form-label fw-semibold" required>
                                    Téléphone
                                    </label>

                                    <input
                                    type="tel"
                                    class="form-control form-control-lg"
                                    id="tel"
                                    name="tel">
                                </div>
                                <div class="row mb-4">
                                    <label for="email" class="form-label fw-semibold" required>
                                    Email
                                    </label>

                                    <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="email"
                                    name="email">
                                </div>
                                <div class="row mb-5">
                                    <label for="message" class="form-label fw-semibold" required>
                                    Message
                                    </label>

                                    <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    cols="30"
                                    rows="10"></textarea>
                                </div>
                                
                                
                                <input type="text" name="website" style="display:none">
                                <div  class="row mb-4">
                                    <button
                                    type="submit"
                                    class="btn btn-primary btn-lg px-5" style="width:100%">
                                    Envoyer
                                    </button>
                                </div>
                            </form>
                            
                        </div>

                    </div>
                </div>                
            </div>
        </div>
    </div>
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <ul>
                        <li><a href="https://www.facebook.com/chamacos.fr" target="_blank"><i class="fa fa-facebook"></i></a></li>
                        <li><a href="https://www.google.com/search?q=chamacos+sete&rlz=1C5CHFA_enFR1040FR1040&oq=chamacos+sete&gs_lcrp=EgZjaHJvbWUyBggAEEUYOdIBCDM0NzlqMGo3qAIAsAIA&sourceid=chrome&ie=UTF-8" target="_blank"><i class="fa fa-google"></i></a></li>
                    </ul>
                    <p>Copyright &copy; 2023 Chamacos</p>
                    <a href="mention.html">Mentions légales</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        async function loadPageContent() {
        const res = await fetch('/json/contact.json', { cache: 'no-store' });
        const data = await res.json();
        document.getElementById('texte-principal').innerHTML = data.html;
        }

        loadPageContent();
        setInterval(loadPageContent, 30000);
    </script>
   
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const form = e.target;

        const nom = form.nom.value.trim();
        const tel = form.tel.value.trim();
        const email = form.email.value.trim();
        const message = form.message.value.trim();
        const website = form.website.value.trim(); // honeypot

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const telRegex = /^(?:(?:\+33|0)[1-9])(?:[\s.-]?\d{2}){4}$/;

        const dangerousPattern = /<[^>]*>|javascript:|onerror=|onclick=|onload=|script/gi;

        if (!nom || nom.length < 2) {
            alert('Merci de renseigner votre nom.');
            return;
        }

        if (dangerousPattern.test(nom)) {
            alert('Le nom contient des caractères non autorisés.');
            return;
        }

        if (!emailRegex.test(email)) {
            alert('Merci de renseigner une adresse email valide.');
            return;
        }

        if (tel && !telRegex.test(tel)) {
            alert('Merci de renseigner un numéro de téléphone valide.');
            return;
        }

        if (!message || message.length < 10) {
            alert('Merci d’écrire un message un peu plus détaillé.');
            return;
        }

        if (dangerousPattern.test(message)) {
            alert('Le message contient du code non autorisé.');
            return;
        }

        const data = {
            nom,
            tel,
            email,
            message,
            website
        };

        const response = await fetch('https://n8n.sebram.fr/webhook/chamacos-contact', {
            method: 'POST',
            headers: {
            'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Message envoyé, merci !');
            form.reset();
        } else {
            alert('Erreur lors de l’envoi. Merci de réessayer.');
        }
        });
        </script>
    </body>
</html>
